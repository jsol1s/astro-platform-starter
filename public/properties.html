<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>PolyCribs - Rentals &amp; Reviews in San Luis Obispo</title>
<meta content="Browse reviewed rentals in San Luis Obispo. Filter by price, area, beds, and baths." name="description"/>
<link href="styles.css" rel="stylesheet"/>

<link rel="icon" type="image/png" sizes="64x64" href="images/PolyCribsLogo.png">
<link rel="apple-touch-icon" href="images/PolyCribsLogo.png">
</head>
<body>
<div class="coming-soon">
  🚧 PolyCribs is currently a prototype — features do not work yet.
</div>
<header class="topbar">
<div class="container topbar__inner">
<a class="brand" href="index.html">
<img class="brand__logo" src="images/polycribs_logo-png.png" alt="PolyCribs logo" />
<span class="brand__name">PolyCribs</span>
</a>
<nav class="nav">
<a class="nav__link" href="properties.html">Find Rentals</a>
<span class="nav__sep">|</span>
<a class="nav__link" href="write-review.html">Write a Review</a>
<span class="nav__sep">|</span>
<a class="nav__link" href="about.html">About</a>
<button aria-label="Open menu" class="menu" title="Menu">
<span></span><span></span><span></span>
</button>
</nav>
</div>
</header>
<main>
<section class="section">
<div class="container">
<h1 class="section__title">Browse Rentals</h1>
<p class="section__sub">Explore places</p>
<div aria-label="Property filters" class="filters" role="region">
<input aria-label="Search by name or address" class="filters__input" id="q" placeholder="Search name or address…" type="text"/>
<label class="filters__label">
<span class="sr-only">Area</span>
<select aria-label="Filter by area" class="filters__select" id="area">
<option value="">All areas</option>
<option value="calpoly">Cal Poly Area</option><option value="downtown">Downtown</option><option value="laguna">Laguna Lake</option><option value="irish">Irish Hills</option><option value="johnson">Johnson Ave</option><option value="broad">Broad Street</option><option value="airport">SLO Airport Area</option>
</select>
<span aria-hidden="true" class="chev">▾</span>
</label>
<label class="filters__label">
<span class="sr-only">Price</span>
<select aria-label="Filter by price" class="filters__select" id="price">
<option value="">Any price</option>
<option value="0-1500">Under $1,500</option>
<option value="1500-2000">$1,500 - $2,000</option>
<option value="2000-2500">$2,000 - $2,500</option>
<option value="2500-3000">$2,500 - $3,000</option>
<option value="3000+">$3,000+</option>
</select>
<span aria-hidden="true" class="chev">▾</span>
</label>
<label class="filters__label">
<span class="sr-only">Beds</span>
<select aria-label="Filter by beds" class="filters__select" id="beds">
<option value="">Any beds</option>
<option value="0">Studio+</option>
<option value="1">1+ bed</option>
<option value="2">2+ beds</option>
<option value="3">3+ beds</option>
<option value="4">4+ beds</option>
</select>
<span aria-hidden="true" class="chev">▾</span>
</label>
<label class="filters__label">
<span class="sr-only">Baths</span>
<select aria-label="Filter by baths" class="filters__select" id="baths">
<option value="">Any baths</option>
<option value="1">1+ bath</option>
<option value="2">2+ baths</option>
<option value="3">3+ baths</option>
</select>
<span aria-hidden="true" class="chev">▾</span>
</label>
<label class="filters__label">
<span class="sr-only">Sort</span>
<select aria-label="Sort results" class="filters__select" id="sort">
<option value="rating_desc">Sort: Rating (high → low)</option>
<option value="price_asc">Sort: Price (low → high)</option>
<option value="price_desc">Sort: Price (high → low)</option>
<option value="reviews_desc">Sort: Most reviewed</option>
</select>
<span aria-hidden="true" class="chev">▾</span>
</label>
<button class="filters__clear" id="clear" type="button">Clear</button>
</div>
<div aria-live="polite" class="resultsbar">
<span id="count"></span>
</div>

<div class="gmapwrap" aria-label="Map of results">
  <div id="gmap" class="gmap" role="application" aria-label="Google map showing rental locations"></div>
</div>

<div class="plist" id="list" role="list"></div>
</div>
</section>
<footer class="footer">
<div class="container footer__inner">
<div class="footer__brand">
<img src="images/polycribs_logo-png.png" alt="PolyCribs logo" style="height:65px;">
<span>PolyCribs</span>
</div>
<div class="footer__copy">
          © <span id="year"></span> polycribs.com - All rights reserved.
        </div>
</div>
</footer>
</main>
<script src="data.js"></script><script>
    const PROPERTIES = (window.POLYCRIBS && window.POLYCRIBS.PROPERTIES) ? window.POLYCRIBS.PROPERTIES : [];
const els = {
      q: document.getElementById('q'),
      area: document.getElementById('area'),
      price: document.getElementById('price'),
      beds: document.getElementById('beds'),
      baths: document.getElementById('baths'),
      sort: document.getElementById('sort'),
      clear: document.getElementById('clear'),
      list: document.getElementById('list'),
      count: document.getElementById('count'),
    };

    
    // Prefill filters from URL params (from homepage search pill)
    const params = new URLSearchParams(window.location.search);
    const qp = params.get("q") || "";
    const pp = params.get("price") || "";
    const bb = params.get("beds_baths") || "";
    const ap = params.get("area") || "";

    if (qp) els.q.value = qp;
    if (pp) els.price.value = pp;

    if (ap) els.area.value = ap;

    if (bb) {
      if (bb === "studio") { els.beds.value = "0"; els.baths.value = ""; }
      else {
        const parts = bb.split("_");
        if (parts.length === 2) {
          els.beds.value = parts[0];
          els.baths.value = parts[1];
        }
      }
    }
function fmtMoney(n) {
      return n.toLocaleString('en-US', { style:'currency', currency:'USD', maximumFractionDigits:0 });
    }

    function areaLabel(key) {
      const map = {
        calpoly: 'Cal Poly Area',
        downtown: 'Downtown',
        laguna: 'Laguna Lake',
        irish: 'Irish Hills',
        johnson: 'Johnson Ave',
        broad: 'Broad Street',
        airport: 'SLO Airport Area',
      };
      return map[key] || key;
    }

    function inPriceRange(price, range) {
      if (!range) return true;
      if (range.endsWith('+')) {
        const min = parseInt(range.replace('+',''), 10);
        return price >= min;
      }
      const [lo, hi] = range.split('-').map(x => parseInt(x, 10));
      return price >= lo && price <= hi;
    }

    function matchText(p, q) {
      if (!q) return true;
      const t = q.trim().toLowerCase();
      return (p.name + ' ' + p.address).toLowerCase().includes(t);
    }

    function filterProps() {
      const q = els.q.value;
      const area = els.area.value;
      const price = els.price.value;
      const beds = els.beds.value === '' ? null : parseInt(els.beds.value, 10);
      const baths = els.baths.value === '' ? null : parseInt(els.baths.value, 10);

      let out = PROPERTIES.filter(p => {
        if (!matchText(p, q)) return false;
        if (area && p.area !== area) return false;
        if (!inPriceRange(p.price, price)) return false;
        if (beds !== null && p.beds < beds) return false;
        if (baths !== null && p.baths < baths) return false;
        return true;
      });

      const sort = els.sort.value;
      out.sort((a,b) => {
        if (sort === 'rating_desc') return (b.rating - a.rating) || (b.reviews - a.reviews);
        if (sort === 'price_asc') return a.price - b.price;
        if (sort === 'price_desc') return b.price - a.price;
        if (sort === 'reviews_desc') return b.reviews - a.reviews;
        return 0;
      });

      return out;
    }

    function render(list) {
      els.list.innerHTML = '';
      const frag = document.createDocumentFragment();

      list.forEach(p => {
        const item = document.createElement('article');
        item.className = 'pitem';
        item.setAttribute('role','listitem');
        item.innerHTML = `
          <a class="pitem__main pitem__link" href="property.html?id=${p.id}">
            <div class="pitem__top">
              <h3 class="pitem__title">${p.name}</h3>
              <span class="pitem__price">${fmtMoney(p.price)}/mo</span>
            </div>
            <div class="pitem__meta">
              <span class="pill">${areaLabel(p.area)}</span>
              <span class="pitem__addr">${p.address}</span>
            </div>
            <div class="pitem__meta2">
              <span class="pill pill--soft">${p.beds === 0 ? 'Studio' : p.beds + ' bd'} · ${p.baths} ba</span>
              <span class="pitem__reviews">${p.reviews} review${p.reviews === 1 ? '' : 's'}</span>
            </div>
          </a>
          <div class="pitem__side">
            <div class="pitem__rating" aria-label="Rating ${p.rating} out of 5">
              <span class="pitem__ratingnum">${p.rating.toFixed(1)}</span>
              <span class="pitem__stars">${'★'.repeat(Math.floor(p.rating))}${p.rating - Math.floor(p.rating) >= 0.5 ? '½' : ''}</span>
            </div>
            <a class="btn btn--outline pitem__btn" href="write-review.html?property=${encodeURIComponent(p.name)}&address=${encodeURIComponent(p.address)}">Write a review</a>
          </div>
        `;
        frag.appendChild(item);
      });

      els.list.appendChild(frag);

      els.count.textContent = list.length === 1 ? 'Showing 1 place' : `Showing ${list.length} places`;
    }

    
    // --- Google Map (frontend-only) ---
    // Uses POLYCRIBS.GEO (lat/lng) from data.js
    let gmap = null;
    let gmarkers = [];
    let ginfo = null;
    let pendingList = null;

    function clearMarkers() {
      gmarkers.forEach(m => m.setMap(null));
      gmarkers = [];
    }

    function updateMap(list) {
      if (!gmap) { pendingList = list; return; }

      clearMarkers();

      const bounds = new google.maps.LatLngBounds();
      let any = false;

      list.forEach(p => {
        const geo = (window.POLYCRIBS && window.POLYCRIBS.GEO) ? window.POLYCRIBS.GEO[p.id] : null;
        if (!geo || typeof geo.lat !== "number" || typeof geo.lng !== "number") return;

        any = true;
        const pos = { lat: geo.lat, lng: geo.lng };
        bounds.extend(pos);

        const marker = new google.maps.Marker({
          position: pos,
          map: gmap,
          title: p.name,
        });

        marker.addListener("click", () => {
          if (!ginfo) ginfo = new google.maps.InfoWindow();
          const html = `
            <div style="font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;">
              <div style="font-weight:800; margin-bottom:4px;">${p.name}</div>
              <div style="margin-bottom:6px;">${p.address}</div>
              <div style="margin-bottom:8px;"><b>${fmtMoney(p.price)}/mo</b> · ${p.beds === 0 ? 'Studio' : p.beds + ' bd'} · ${p.baths} ba</div>
              <a href="property.html?id=${p.id}">View details →</a>
            </div>
          `;
          ginfo.setContent(html);
          ginfo.open(gmap, marker);
        });

        gmarkers.push(marker);
      });

      if (any) {
        gmap.fitBounds(bounds, 60);
      } else {
        gmap.setCenter({ lat: 35.2828, lng: -120.6596 });
        gmap.setZoom(13);
      }
    }

    // Called by Google Maps script callback
    function initMap() {
      gmap = new google.maps.Map(document.getElementById("gmap"), {
        center: { lat: 35.2828, lng: -120.6596 }, // San Luis Obispo
        zoom: 13,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: false,
      });

      // If filters already ran before Maps loaded, paint markers now
      if (pendingList) updateMap(pendingList);
    }


function refresh() {
      const list = filterProps();
      render(list);
      // keep the map in sync with the filtered list
      if (window.google && window.google.maps) updateMap(list);
      else pendingList = list;
    }

    ['input','change'].forEach(evt => {
      els.q.addEventListener(evt, refresh);
    });
    ['change'].forEach(evt => {
      els.area.addEventListener(evt, refresh);
      els.price.addEventListener(evt, refresh);
      els.beds.addEventListener(evt, refresh);
      els.baths.addEventListener(evt, refresh);
      els.sort.addEventListener(evt, refresh);
    });

    els.clear.addEventListener('click', () => {
      els.q.value = '';
      els.area.value = '';
      els.price.value = '';
      els.beds.value = '';
      els.baths.value = '';
      els.sort.value = 'rating_desc';
      refresh();
    });

    // Footer year (if present)
    const yearEl = document.getElementById('year');
    if (yearEl) yearEl.textContent = new Date().getFullYear();

    refresh();
  </script>

  <script>
  // Hide topbar on scroll down, show on scroll up
  let lastScroll = 0;
  const topbar = document.querySelector(".topbar");

  window.addEventListener("scroll", () => {
    const y = window.pageYOffset || document.documentElement.scrollTop;
    if (y > lastScroll && y > 80) topbar.classList.add("is-hidden");
    else topbar.classList.remove("is-hidden");
    lastScroll = y;
  });
</script>

  <!-- Google Maps thingy-->
  <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAgv07mH0MrK1ch45I3MNLS87S6DEELllk&callback=initMap"></script>
</body>
</html>
